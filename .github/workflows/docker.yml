name: Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        id: filter
        with:
          filters: .github/path-filters.yml

  build:
    name: build and push
    needs: changes
    if: always() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DOCKHAND_WEBHOOK_URL: ${{ secrets.DOCKHAND_WEBHOOK_URL }}
      DOCKHAND_WEBHOOK_SECRET: ${{ secrets.DOCKHAND_WEBHOOK_SECRET }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
        with:
          images: ghcr.io/chronophylos/twitch-1337
          tags: |
            type=raw,value=latest
            type=raw,value=b${{ github.run_number }}

      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        env:
          GIT_SHA: ${{ github.sha }}
          BUILD_NUM: b${{ github.run_number }}
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ env.GIT_SHA }}
            BUILD_NUM=${{ env.BUILD_NUM }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Tell dockhand the new :latest is live so it pulls + redeploys.
      # Fires only after a successful push; no-ops if the secret is unset.
      # Auth: GitLab-style plain token header (X-Gitlab-Token). Configure the
      # dockhand stack webhook with the matching secret, and enable
      # force-redeploy there — a :latest push is not a new git commit, so
      # without it dockhand returns {"skipped":true} and never restarts.
      # URL + secret stay in env so they never land in a `${{ }}`-expanded
      # run line or the step log.
      - name: Trigger dockhand redeploy
        if: ${{ env.DOCKHAND_WEBHOOK_URL != '' }}
        run: |
          curl -fsS -X POST \
            -H "X-Gitlab-Token: $DOCKHAND_WEBHOOK_SECRET" \
            "$DOCKHAND_WEBHOOK_URL"
