name: Docker

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DOCKHAND_WEBHOOK_URL: ${{ secrets.DOCKHAND_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6
        with:
          images: ghcr.io/chronophylos/twitch-1337
          tags: |
            type=raw,value=latest
            type=raw,value=b${{ github.run_number }}

      - uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7
        env:
          GIT_SHA: ${{ github.sha }}
          BUILD_NUM: b${{ github.run_number }}
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ env.GIT_SHA }}
            BUILD_NUM=${{ env.BUILD_NUM }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Tell dockhand the new :latest is live so it pulls + redeploys.
      # Fires only after a successful push; no-ops if the secret is unset.
      # URL carries the stack token as a query param — keep it in env so it
      # never lands in a `${{ }}`-expanded run line or the step log.
      - name: Trigger dockhand redeploy
        if: ${{ env.DOCKHAND_WEBHOOK_URL != '' }}
        run: curl -fsS -X POST "$DOCKHAND_WEBHOOK_URL"
